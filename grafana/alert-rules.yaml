# Grafana alert-rule provisioning for HustleHub+
# Reference: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
#
# Import via:
#   • Grafana Cloud: Grafana UI → Alerting → Alert rules → Import (paste file)
#   • Self-hosted:   place in <grafana_home>/provisioning/alerting/hustlehub-alerts.yaml
#   • Terraform:     use grafana_rule_group resource referencing this file
#
# The Loki data source UID must match your Grafana Cloud instance.
# Replace <LOKI_DS_UID> with the actual UID from
#   Grafana → Connections → Data Sources → Loki → copy UID from browser URL.

apiVersion: 1

groups:
  - orgId: 1
    name: hustlehub-security
    folder: HustleHub+
    interval: 1m        # evaluation interval

    rules:

      # ── 1. High failed-login rate ────────────────────────────────────────
      # Fires when ≥ 10 failed login attempts are recorded in any 5-minute
      # window (credential-stuffing or brute-force indicator).
      - uid: hustlehub-failed-login-rate
        title: "High Failed Login Rate"
        condition: threshold

        data:
          # Step A: LogQL – count failed logins over the last 5 minutes
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 300    # 5 minutes ago
              to: 0
            datasourceUid: <LOKI_DS_UID>
            model:
              editorMode: code
              expr: >-
                sum(count_over_time(
                  {service_name="hustlehub-plus-api"}
                  | json
                  | event="auth.login.failed"
                  [5m]
                ))
              legendFormat: failed_logins
              maxLines: 1000
              queryType: range

          # Step B: Reduce to a scalar
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: sum
              expression: A

          # Step C: Threshold condition
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [9]      # > 9 = at least 10 failures

        noDataState: OK
        execErrState: Error
        for: 0s           # fire immediately on first evaluation that meets the threshold
        isPaused: false

        labels:
          severity: warning
          team: security

        annotations:
          summary: "High rate of failed login attempts"
          description: >-
            {{ $values.B.Value | printf "%.0f" }} failed login attempts detected
            in the last 5 minutes on HustleHub+ API. Possible credential-stuffing
            or brute-force attack. Check the Security Events panel in the
            HustleHub+ API Logs dashboard.
          runbook_url: "https://github.com/st10286905/insy7314-2026-hustlehub-plus-part2-st10286905/wiki/Runbooks#failed-login-rate"
          dashboard_uid: "hustlehub-api-logs"
          panel_id: "9"

      # ── 2. Repeated access-denied for a single user ─────────────────────
      # Fires when any single userId accumulates ≥ 5 access-denied events in
      # a 10-minute window (possible privilege-escalation probe).
      - uid: hustlehub-access-denied-spike
        title: "Access Denied Spike per User"
        condition: threshold

        data:
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 600    # 10 minutes ago
              to: 0
            datasourceUid: <LOKI_DS_UID>
            model:
              editorMode: code
              expr: >-
                max by (userId) (
                  count_over_time(
                    {service_name="hustlehub-plus-api"}
                    | json
                    | event="security.access_denied"
                    [10m]
                  )
                )
              legendFormat: "{{userId}}"
              queryType: range

          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: max
              expression: A

          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [4]      # > 4 = at least 5 denials

        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false

        labels:
          severity: warning
          team: security

        annotations:
          summary: "Repeated access-denied events for a single user"
          description: >-
            A userId has been denied access {{ $values.B.Value | printf "%.0f" }}
            times in the last 10 minutes. Review the Security Events panel.
          dashboard_uid: "hustlehub-api-logs"
          panel_id: "5"

      # ── 3. Error-rate spike ──────────────────────────────────────────────
      # Fires when unhandled 500-level errors exceed 5 per minute for two
      # consecutive evaluation intervals (sustained server fault indicator).
      - uid: hustlehub-error-rate-spike
        title: "API Error Rate Spike"
        condition: threshold

        data:
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: <LOKI_DS_UID>
            model:
              editorMode: code
              expr: >-
                sum(rate(
                  {service_name="hustlehub-plus-api"}
                  | json
                  | level="error"
                  [1m]
                )) * 60
              legendFormat: errors/min
              queryType: range

          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: mean
              expression: A

          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [5]      # > 5 errors/min on average

        noDataState: OK
        execErrState: Error
        for: 2m           # must be sustained for 2 minutes before firing
        isPaused: false

        labels:
          severity: critical
          team: backend

        annotations:
          summary: "Sustained API error rate above threshold"
          description: >-
            Average error rate is {{ $values.B.Value | printf "%.1f" }} errors/min
            over the last 5 minutes (threshold: 5/min). Check the HustleHub+ API
            Logs dashboard for details.
          dashboard_uid: "hustlehub-api-logs"
          panel_id: "2"
