name: HustleHub+ CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests and API Integration
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/hustlehub_test
      JWT_SECRET: ci-test-secret
      USE_HTTPS: "true"
      CLIENT_ORIGIN: https://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Initialise backend
        run: npm run init

      - name: Run backend tests
        run: npm test

      - name: Start backend
        run: |
          node src/server.js > /tmp/hustlehub-backend.log 2>&1 &
          echo $! > /tmp/hustlehub-backend.pid

      - name: Wait for HTTPS backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent --insecure https://127.0.0.1:3000/api/gigs > /dev/null; then
              echo "HTTPS backend is ready"
              exit 0
            fi

            sleep 2
          done

          echo "Backend failed to become ready"
          cat /tmp/hustlehub-backend.log
          exit 1

      - name: Run Newman API integration tests
        run: |
          npx newman run \
            tests/postman/HustleHub-Auth.postman_collection.json \
            -e tests/postman/HustleHub-Local.postman_environment.json \
            --folder "Bookings" \
            --env-var "baseUrl=https://127.0.0.1:3000" \
            --insecure \
            --reporters cli

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/hustlehub-backend.pid ]; then
            kill "$(cat /tmp/hustlehub-backend.pid)" || true
          fi

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
