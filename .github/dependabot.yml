version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: test
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /frontend
    target-branch: test
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /backend
    target-branch: test
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    target-branch: test
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    target-branch: test
    schedule: { interval: weekly }
