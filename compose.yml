services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      USE_HTTPS: "true"
      CLIENT_ORIGIN: http://localhost:8080
    volumes:
      - ./backend/secrets:/app/secrets:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const https=require('https');const r=https.get('https://127.0.0.1:3000/health',{rejectUnauthorized:false},res=>process.exit(res.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/"
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5