name: HustleHub+ CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests and API Integration
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 3000
      MONGO_URI: ${{ secrets.MONGO_URI }}
      USE_HTTPS: "true"
      CLIENT_ORIGIN: http://localhost:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm install

      - name: Generate a throwaway JWT secret for this run
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Initialise backend
        run: npm run init

      - name: Run backend tests
        id: backend_tests
        run: npm test
        continue-on-error: true

      - name: Run Jest tests
        id: jest_tests
        run: AUTH_RATE_LIMIT=100 BOOKING_RATE_LIMIT=100 npm run test:jest
        continue-on-error: true

      - name: Start backend
        run: |
          node src/server.js > /tmp/hustlehub-backend.log 2>&1 &
          echo $! > /tmp/hustlehub-backend.pid

      - name: Wait for HTTPS backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent --insecure https://127.0.0.1:3000/api/gigs > /dev/null; then
              echo "HTTPS backend is ready"
              exit 0
            fi

            sleep 2
          done

          echo "Backend failed to become ready"
          cat /tmp/hustlehub-backend.log
          exit 1

      - name: Debug Mongoose
        run: |
          node -e '
            const Booking = require("./src/models/booking");
            console.log("mongoose", require("mongoose").version);
            console.log(
              "status handlers",
              Object.keys(Booking.schema.path("status").$conditionalHandlers)
            );
            console.log(
              "filter",
              Booking.findOne({
                status: { $in: ["Pending", "Confirmed"] }
              }).getFilter()
            );
          '

      - name: Run Newman API integration tests
        id: newman_tests
        run: |
          npx newman run \
            tests/postman/HustleHub-API.postman_collection.json \
            -e tests/postman/HustleHub-Local.postman_environment.json \
            --folder "Bookings" \
            --env-var "baseUrl=https://127.0.0.1:3000" \
            --insecure \
            --reporters cli
        continue-on-error: true

      - name: Show backend log
        if: always()
        run: cat /tmp/hustlehub-backend.log

      - name: Backend CI test gate
        if: always()
        run: |
          if [[ "${{ steps.backend_tests.outcome }}" == "failure" ||
                "${{ steps.jest_tests.outcome }}" == "failure" ||
                "${{ steps.newman_tests.outcome }}" == "failure" ]]; then
            echo "One or more backend test suites failed."
            exit 1
          fi

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/hustlehub-backend.pid ]; then
            kill "$(cat /tmp/hustlehub-backend.pid)" || true
          fi

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend tests
        id: frontend_tests
        run: npm test
        continue-on-error: true

      - name: Build frontend
        id: frontend_build
        run: npm run build
        continue-on-error: true

      - name: Frontend CI test gate
        if: always()
        run: |
          if [[ "${{ steps.frontend_tests.outcome }}" == "failure" ||
                "${{ steps.frontend_build.outcome }}" == "failure" ]]; then
            echo "One or more frontend checks failed."
            exit 1
          fi
